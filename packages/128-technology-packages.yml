note: >-
  128 Technology publishes no REST/GraphQL client SDK. The first-party libraries it does ship
  are the building blocks of the SSR's own management surface — YIN/YANG data-model handling
  (yinz, yinz-json, yinsolidated), a NETCONF client (netconfetti), and the GUI component
  libraries. All @128technology-scoped npm packages and the PyPI yinsolidated package are
  published by the company itself, which is why they are marked official. Versions and dates
  are read from the registry metadata endpoints on the date above; the whole set is dormant,
  with the newest release in 2022, which is itself the finding.
