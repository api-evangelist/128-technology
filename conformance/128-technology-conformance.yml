domain_standards:
- id: netconf-yang-network-management
  name: NETCONF/YANG network configuration management
  market: Network element configuration and management
  conforms: true
  declared_in: >-
    The product's own data model. The SSR's configuration and state tree is authored in YANG and
    served over NETCONF, and the company open-sources the YIN/YANG toolchain it uses to do so
    (yinsolidated, yinz, yinz-json, a pyang fork, netconfetti, python-netconf-utilities).
  evidence: https://github.com/128technology/yinsolidated
  why_it_matters: >-
    NETCONF/YANG is the interoperability standard for programmatic network-element configuration.
    An operator whose orchestration stack already speaks NETCONF/YANG can drive the SSR with the
    tooling it has; the REST and GraphQL surfaces are projections of the same YANG tree, so the
    model is the contract even though no OpenAPI is published.
certifications:
- id: common-criteria
  name: Common Criteria (CCRA)
  status: certified
  scope: >-
    Juniper SSR software v6.2.5-5r2 on SSR 120, 130, 1200, 1300, 1400 and 1500 appliances,
    deployed per the SSR Common Criteria Installation and User Guide V1.0.
  conditions:
  - FIPS mode must be enabled during installation.
  - >-
    Except during installation, all configuration must be performed from the CLI; the GUI is not
    part of the approved use case (the Conductor GUI is acceptable for the router OTP Quickstart
    file).
  - Administration is Common Criteria-certified only when performed through the CLI.
  - Management over forwarding interfaces is non-compliant; SSH management must use non-forwarding interfaces.
  docs: https://docs.128technology.com/docs/cc_fips_intro
  external: https://www.commoncriteriaportal.org/
- id: fips-140-2
  name: FIPS 140-2
  status: certified-components
  scope: >-
    SSH for remote administration on port 22 using OpenSSH v7.4 and OpenSSL v1.0.2k, certified
    for FIPS 140-2 compliance. SSR400/SSR440 EEPROM migrated to a FIPS-compliant encryption
    scheme in 7.2.0.
  docs: https://docs.128technology.com/docs/cc_fips_compliance_guidelines
