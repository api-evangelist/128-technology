standards:
- id: netconf-rfc6241
  name: NETCONF (RFC 6241)
  conforms: true
  evidence: >-
    The SSR exposes its configuration and state over NETCONF alongside REST and GraphQL; the
    company publishes a NETCONF client (@128technology/netconfetti) and NETCONF utilities
    (github.com/128technology/python-netconf-utilities) against it.
  source: https://github.com/128technology/netconfetti
- id: yang-rfc7950
  name: YANG data modeling language (RFC 7950 / RFC 6020)
  conforms: true
  evidence: >-
    The entire SSR configuration and state tree is YANG-modeled. The company publishes
    yinsolidated (PyPI + GitHub), yinz and yinz-json to consume the YIN representation of that
    model, and a fork of pyang.
  source: https://pypi.org/project/yinsolidated/
- id: graphql
  name: GraphQL
  conforms: true
  evidence: >-
    A GraphQL API is offered as an alternative to REST, documented with an interactive explorer
    served from the deployed instance at https://<SSR address>/documentation/graphql.
  source: https://docs.128technology.com/docs/intro_rest_graphql_apis
- id: rest-json
  name: REST over HTTP with JSON payloads
  conforms: true
  evidence: >-
    Documented as standard HTTP verbs against resources under /api/v1 with
    Content-Type application/json.
  source: https://docs.128technology.com/docs/intro_rest_graphql_apis
- id: jwt-rfc7519
  name: JSON Web Token (RFC 7519)
  conforms: true
  evidence: >-
    POST /api/v1/login returns an RS256-signed JWT carrying name, roles, scopes and capabilities
    claims; it is presented as an RFC 6750 Bearer credential.
  source: https://docs.128technology.com/docs/intro_rest_graphql_apis
- id: bearer-token-rfc6750
  name: OAuth 2.0 Bearer Token Usage (RFC 6750)
  conforms: partial
  evidence: >-
    The Authorization: Bearer <token> presentation form is used, but the token is minted by a
    username/password login endpoint, not by an OAuth 2.0 authorization server. There is no
    /token endpoint, no client credentials, and no scope negotiation.
  source: https://docs.128technology.com/docs/intro_rest_graphql_apis
- id: oauth2
  name: OAuth 2.0
  conforms: false
