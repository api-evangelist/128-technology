- version: 7.2.1-1r1
  date: '2026-07-14'
  breaking: false
  additions: []
  fixes:
  - >-
    I95-65610 SSR400/SSR440 routers not connecting to the Conductor after upgrade — runtime RPM
    upgrades of the minion-connector failed to start due to missing IMA file signatures.
  source: https://docs.128technology.com/docs/release_notes_128t_7.2
- version: 7.2.0-29r1
  date: '2026-07-01'
  breaking: false
  additions:
  - I95-25150 AES-GCM encryption replaces AES-CBC + HMAC-SHA for SVR peer paths.
  - I95-55344 SSL Forward Proxy for HTTPS decrypt/re-encrypt with IDP and AV scanning.
  - I95-60371 Adaptive PMTU change handling for long-lived sessions.
  - I95-61066 Simplified interface naming for cloud images (Linux names instead of PCI/VMBus UUIDs).
  - I95-64149 Enhanced security key-management audit events for all success-path PKI operations.
  - I95-64645 Peering identity may be carried in a SAN URI extension instead of the Common Name.
  - I95-64845 Additional audit events and logs for the certificate APIs.
  - I95-34472 Waypoint pool exhaustion monitoring via a new `show waypoints` command.
  - I95-61467 `show bgp` filtered-routes option exposes prefixes suppressed by inbound policy.
  - I95-63012 AppID scale optimization.
  - I95-64435 SSR400/SSR440 migrated to a FIPS-compliant EEPROM encryption scheme.
  - WAN-3182 In-band management inbound apps (ICMP, SNMP) from selected user networks.
  fixes:
  - 89 CVEs resolved in this release, enumerated on the release-notes page.
  - I95-61693 DHCP INFORM responses now include the requested options.
  - I95-63547 Time-based HMAC peering failed when peer clock delta exceeded 2 seconds.
  source: https://docs.128technology.com/docs/release_notes_128t_7.2
- version: 7.1.6-7-sts
  date: '2026-07-15'
  breaking: false
  additions:
  - I95-62868 Multicast failover optimizations and PIM Graceful Restart convergence improvements.
  - I95-63012 AppID scale optimization for WAN deployments.
  fixes:
  - 59 CVEs resolved in this release, enumerated on the release-notes page.
  - I95-63951 BGP graceful restart no longer sends End-of-RIB prematurely (RFC 4724).
  - I95-64250 BGP routes received from peers but not installed in the RIB.
  - I95-63965 SNMP MIB walks on subinterfaces reported incorrect statistics.
  source: https://docs.128technology.com/docs/release_notes_128t_7.1
