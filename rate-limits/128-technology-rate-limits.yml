note: >-
  No API rate limits are published. The SSR REST and GraphQL APIs are served by the customer's
  own router or conductor, so there is no vendor-imposed quota to document and no
  X-RateLimit-*/RateLimit-*/Retry-After header behaviour is described anywhere in the
  documentation. The docs do warn about a related but different concern: the conductor polls
  routers over REST/GraphQL for monitoring, and at scale that becomes a conductor performance
  problem, which is the stated reason the push-based Monitoring Agent exists. That is a capacity
  caution, not a rate limit, and is not recorded as one here.
