aid: 128-technology
name: 128 Technology
description: '128 Technology is the Burlington, Massachusetts networking company behind the Session Smart
  Networking platform — a 100% software-defined, session-aware IP routing and network services stack built
  on Secure Vector Routing (SVR), a tunnel-free routing protocol. The platform pairs the Session Smart
  Router (SSR) data/control plane with the Session Smart Conductor, a centralized management, policy and
  provisioning engine. Juniper Networks acquired 128 Technology in 2020 for $450M and the product line
  now ships as the Juniper Session Smart Router, but 128 Technology remains the operating identity of
  the developer surface: the product documentation is still served from docs.128technology.com and the
  open-source libraries are still published under the github.com/128technology organization and the @128technology
  npm scope. The SSR exposes a YANG-modeled configuration and state tree over a REST API (/api/v1), a
  GraphQL API, and NETCONF — all served by the customer''s own deployed router or conductor rather than
  from a vendor-hosted cloud endpoint.'
