apis:
- aid: 128-technology:128-technology-ssr-api
  name: Session Smart Router REST and GraphQL API
  description: 'The northbound API of the Juniper Session Smart Router (SSR) and Session Smart Conductor.
    A YANG-modeled configuration and state tree is exposed over a REST API rooted at /api/v1, an equivalent
    GraphQL API, and NETCONF. Tokens are issued by POST /api/v1/login in exchange for a username and password
    and presented as an Authorization: Bearer JWT on every subsequent call; the caller''s RBAC role (config-read,
    config-write, provisioning) and resource groups determine what the token can reach. The API is served
    by the customer''s own deployed SSR or Conductor instance, so the base URL is the address of that
    instance; the interactive Swagger and GraphQL references are served from the same instance at /documentation/swagger
    and /documentation/graphql.'
  humanURL: https://docs.128technology.com/docs/intro_rest_graphql_apis
  baseURL: https://{ssr-address}/api/v1
